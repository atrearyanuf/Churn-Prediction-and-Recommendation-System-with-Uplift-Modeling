name: pipeline

# Train the batch pipeline on Linux and check that it reproduces the committed
# notebook's models and validation results; build the Docker image and run
# train, score and monitor inside it.
on:
  workflow_dispatch:
  push:
    paths:
      - "churn_uplift/**"
      - "functions/**"
      - requirements.txt
      - config.toml
      - Dockerfile
      - .dockerignore
      - Churn_Uplift_COMPLETE.ipynb
      - tools/check_pipeline_matches_notebook.py
      - .github/workflows/pipeline.yml
  pull_request:
    paths:
      - "churn_uplift/**"
      - "functions/**"
      - requirements.txt
      - config.toml
      - Dockerfile
      - .dockerignore
      - Churn_Uplift_COMPLETE.ipynb
      - tools/check_pipeline_matches_notebook.py
      - .github/workflows/pipeline.yml

jobs:
  matches-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: python -m churn_uplift train
      - run: python -m tools.check_pipeline_matches_notebook Churn_Uplift_COMPLETE.ipynb artifacts/metrics.json

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t churn-uplift .
      - run: docker run --rm churn-uplift --help
      - name: Train, score and monitor inside the image
        run: >
          docker run --rm --entrypoint sh churn-uplift -c '
          python -m churn_uplift train &&
          python -c "import pandas as pd; pd.read_parquet(\"data/churn_uplift_anonymized.parquet\").drop(columns=[\"y\", \"t\"]).head(500).to_csv(\"batch.csv\", index=False)" &&
          python -m churn_uplift score batch.csv &&
          python -m churn_uplift monitor batch.csv'
