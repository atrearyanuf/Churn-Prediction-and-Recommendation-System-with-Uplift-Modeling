name: xgb-diag (temporary)
on:
  push:
    paths: [tools/xgb_platform_diag.py, .github/workflows/xgb-diag.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install -r requirements.txt
      - run: python tools/xgb_platform_diag.py
      - run: lscpu | grep -E "Model name|^CPU\(s\)"
