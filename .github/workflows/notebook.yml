name: notebook

# Re-run the notebook from scratch, including the dataset download, and fail if
# it prints different results than the committed copy. Runs weekly, so a dead
# data source is noticed, and whenever code the results depend on changes.
on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    paths:
      - Churn_Uplift_COMPLETE.ipynb
      - "functions/**"
      - requirements.txt
      - tools/compare_notebook_outputs.py
      - .github/workflows/notebook.yml
  pull_request:
    paths:
      - Churn_Uplift_COMPLETE.ipynb
      - "functions/**"
      - requirements.txt
      - tools/compare_notebook_outputs.py
      - .github/workflows/notebook.yml

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Run the notebook from scratch
        run: >
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=1800
          --output executed.ipynb Churn_Uplift_COMPLETE.ipynb
      - name: Compare printed results with the committed notebook
        run: python tools/compare_notebook_outputs.py Churn_Uplift_COMPLETE.ipynb executed.ipynb
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: executed.ipynb
